    const { createElement: e, useState, useEffect, useRef } = React;

    // Cross-browser storage adapter. Some mobile/private-browser environments can
    // expose localStorage but throw on read/write. Keeping this adapter under the
    // same localStorage name makes the existing app functions degrade gracefully
    // instead of crashing the entire React tree.
    const localStorage = (() => {
      let native = null;
      const memory = Object.create(null);
      try { native = window.localStorage; const probe='__lynnaya_storage_probe__'; native.setItem(probe,'1'); native.removeItem(probe); } catch (err) { native = null; }
      return {
        get length() { try { return native ? native.length : Object.keys(memory).length; } catch (err) { return Object.keys(memory).length; } },
        key(index) { try { return native ? native.key(index) : (Object.keys(memory)[index] ?? null); } catch (err) { return Object.keys(memory)[index] ?? null; } },
        getItem(key) { const k=String(key); try { return native ? native.getItem(k) : (Object.prototype.hasOwnProperty.call(memory,k)?memory[k]:null); } catch (err) { return Object.prototype.hasOwnProperty.call(memory,k)?memory[k]:null; } },
        setItem(key,value) { const k=String(key), v=String(value); try { if(native){ native.setItem(k,v); return; } } catch (err) {} memory[k]=v; },
        removeItem(key) { const k=String(key); try { if(native){ native.removeItem(k); } } catch (err) {} delete memory[k]; },
        clear() { try { if(native) native.clear(); } catch (err) {} Object.keys(memory).forEach(k=>delete memory[k]); }
      };
    })();

    function HeaderButton(props) {
      if (props.isTelegram) {
        return e('button', { onClick: props.onClick, className: 'btn-telegram' }, '📤 ' + props.label);
      }
      if (props.isFinance) {
        return e('button', { onClick: props.onClick, className: 'btn-finance' }, '💰 ' + props.label);
      }
      if (props.isAction) {
        return e('button', { onClick: props.onClick, className: 'btn-action' }, '+ ' + props.label);
      }
      if (props.isAudit) {
        return e('button', { onClick: props.onClick, className: 'btn-audit' }, '⚡ ' + props.label);
      }
      if (props.isCreateRoom) {
        return e('button', { onClick: props.onClick, className: 'btn-create-room' }, '🚪 ' + props.label);
      }
      return e('button', { 
        onClick: props.onClick, 
        className: 'btn-nav ' + (props.active ? 'active' : '') 
      }, props.label);
    }

    // Helper function to send Telegram notifications
    async function sendTelegramMessage(token, chatId, textMessage) {
      if (!token || !chatId) return;
      try {
        const url = `https://api.telegram.org/bot${token}/sendMessage`;
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text: textMessage, parse_mode: 'Markdown' })
        });
      } catch (err) {
        console.error('Failed to send Telegram message:', err);
      }
    }

    // Ledger convention: charges/postings are positive (+); payments/deposits are negative (-).
    function ledgerCredit(item) {
      const c = Number(item && item.credit || 0);
      if (!c) return 0;
      const cat = String(item.category || '');
      if (cat.startsWith('Payment (') || cat.startsWith('Deposit (') || item.transactionType === 'Payment' || item.transactionType === 'Deposit') return -Math.abs(c);
      return c;
    }
    function ledgerAmount(item) { return item && !item.voided ? Number(item.debit || 0) + ledgerCredit(item) : 0; }
    function ledgerOutstanding(booking) {
      return [...((booking && booking.masterFolioItems) || []), ...((booking && booking.extraCharges) || [])].reduce((n,x)=>n+ledgerAmount(x),0);
    }
    function isAccommodationPosting(item) {
      return !!item && (item.transactionType === 'Accommodation' || item.postingType === 'Accommodation' || String(item.description || '').startsWith('Room Rate (Night '));
    }
    // Shared currency formatter used by Finance, POS and other modules.
    function formatMoney(n) { return '$' + Number(n || 0).toFixed(2); }
    // Shared local-date helpers used by both POSApp and PMSApp (including Group Check-In).
    // Keep these at module scope so HMS/PMS functions can call them without a runtime error.
    // Global date helpers: expose them on window as well as lexical functions.
    // This avoids ReferenceError in mobile WebViews/PWA shells after cached-module
    // transitions and gives every PMS component one stable date API.
    function todayLocal() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function nextLocalDate(date) {
      const d = new Date(String(date || todayLocal()) + 'T12:00:00');
      d.setDate(d.getDate() + 1);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    window.__lynnayaTodayLocal = todayLocal;
    window.__lynnayaNextLocalDate = nextLocalDate;
    // Compatibility aliases for any previously cached event/component code.
    try { window.todayLocal = todayLocal; window.nextLocalDate = nextLocalDate; } catch (err) {}

    // Production-readiness helpers for the static/local PMS build.
    // These provide backup/restore and a lightweight audit trail. They do not
    // replace a server-side database/authentication layer for multi-device use.
    function downloadTextFile(filename, text, mime='application/json') {

    function HotelDashboardComponent({ roomList, roomConfigs, roomBookings, onOpenAvailability }) {
      const totalRooms = roomList.length;

      const categoryCounts = {};
      roomList.forEach(room => {
        const conf = roomConfigs[room] || { category: 'Standard' };
        const cat = conf.category || 'Standard';
        categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
      });

      let availableCount = 0;
      let dirtyCount = 0;
      let maintenanceCount = 0;
      let occupiedCount = 0;

      const todayStr = new Date().toISOString().split('T')[0];

      roomList.forEach(room => {
        const conf = roomConfigs[room] || { operationalStatus: 'Clean' };
        const bookings = roomBookings[room] || [];
        
        let isOccupied = false;
        for (let i = 0; i < bookings.length; i++) {
          const b = bookings[i];
          if (todayStr >= b.checkIn && todayStr < b.checkOut && b.status === 'In-House') {
            isOccupied = true;
            break;
          }
        }

        if (isOccupied) {
          occupiedCount++;
        } else if (conf.operationalStatus === 'Maintenance') {
          maintenanceCount++;
        } else if (conf.operationalStatus === 'Dirty') {
          dirtyCount++;
        } else {
          availableCount++;
        }
      });

      const calcPercent = (count) => totalRooms > 0 ? ((count / totalRooms) * 100).toFixed(1) + '%' : '0.0%';

      // Dashboard quick-action availability: show the actual rooms that are
      // Available + Clean for today's stay window. This is intentionally
      // calculated from the same room/bookings data used by the PMS.
      const tomorrowStr = (() => {
        const d = new Date(todayStr + 'T12:00:00');
        d.setDate(d.getDate() + 1);
        return d.toISOString().split('T')[0];
      })();
      const quickAvailableRooms = roomList.filter(room => {
        const conf = roomConfigs[room] || {};
        if (conf.operationalStatus === 'Maintenance' || conf.operationalStatus === 'Dirty') return false;
        const bookings = roomBookings[room] || [];
        return !bookings.some(b => {
          if (!b || !b.checkIn || !b.checkOut) return false;
          if (['Cancelled','No-Show'].includes(b.status)) return false;
          return String(b.checkIn) < tomorrowStr && String(b.checkOut) > todayStr;
        });
      });

      return e('div', null,
        e('h2', null, 'Hotel Executive Dashboard & Room Statistics'),
        
        e('div', { className: 'grid-2', style: { marginBottom: '1.5rem' } },
          e('div', { className: 'card-lg', style: { backgroundColor: '#0f172a', color: '#ffffff' } },
            e('h3', { style: { fontSize: '0.875rem', color: '#cbd5e1', marginBottom: '0.25rem', textTransform: 'uppercase' } }, 'Total Hotel Rooms'),
            e('p', { style: { fontSize: '2rem', fontWeight: 800, color: '#fbbf24' } }, totalRooms),
            e('p', { style: { fontSize: '0.8rem', color: '#94a3b8', marginTop: '0.5rem' } }, 'Fully managed property inventory')
          ),
          e('div', { className: 'card-lg', style: { backgroundColor: '#ffffff' } },
            e('h3', { style: { fontSize: '0.875rem', color: '#64748b', marginBottom: '0.25rem', textTransform: 'uppercase' } }, 'Current Occupancy Rate'),
            e('p', { style: { fontSize: '2rem', fontWeight: 800, color: '#2563eb' } }, calcPercent(occupiedCount)),
            e('p', { style: { fontSize: '0.8rem', color: '#64748b', marginTop: '0.5rem' } }, `${occupiedCount} of ${totalRooms} rooms currently occupied`)
          )
        ),

        e('div', { className: 'card-lg', style: { marginBottom: '1.5rem', border: '2px solid #10b981', background: 'linear-gradient(180deg,#f0fdf4 0%,#ffffff 100%)' } },
          e('div', { className: 'flex-between', style: { gap: '1rem', flexWrap: 'wrap', marginBottom: '.85rem' } },
            e('div', null,
              e('h3', { style: { fontSize: '1.1rem', fontWeight: 800, margin: 0, color: '#065f46' } }, '⚡ Quick Action — Room Availability Today'),
              e('p', { className: 'text-muted', style: { margin: '.2rem 0 0' } }, `${quickAvailableRooms.length} room(s) Available + Clean for today`)
            ),
            e('button', { type: 'button', className: 'btn-primary', style: { background: '#059669', borderColor: '#059669', fontWeight: 800 }, onClick: () => onOpenAvailability && onOpenAvailability() }, '🛏️ Open Full Availability')
          ),
          e('div', { className: 'availability-table-wrap' },
            e('table', { className: 'availability-table' },
              e('thead', null,
                e('tr', null,
                  e('th', null, 'Room'),
                  e('th', null, 'Category'),
                  e('th', { style: { textAlign: 'right' } }, 'Rate / Night'),
                  e('th', { style: { textAlign: 'center' } }, 'Status')
                )
              ),
              e('tbody', null,
                quickAvailableRooms.length ? quickAvailableRooms.map(room => {
                  const conf = roomConfigs[room] || {};
                  return e('tr', { key: room, onClick: () => onOpenAvailability && onOpenAvailability(), style: { cursor: onOpenAvailability ? 'pointer' : 'default' } },
                    e('td', { style: { fontWeight: 800 } }, 'Room ' + room),

    function FinanceDashboardComponent({ roomList, roomBookings, setRoomBookings, adminSettings }) {
      const allFlattenedBookings = [];
      roomList.forEach(room => {
        const bookings = roomBookings[room] || [];
        bookings.forEach(b => {
          allFlattenedBookings.push({ ...b, roomName: room });
        });
      });

      let totalAccomRev = 0;
      let totalRestaurantRev = 0;
      let totalSpaRev = 0;
      let totalTourRev = 0;

      allFlattenedBookings.forEach(b => {
        if (b.status !== 'Cancelled') {
          (b.masterFolioItems || []).forEach(it => {
            if (!it.voided && isAccommodationPosting(it)) totalAccomRev += Number(it.debit || 0);
          });
          if (b.extraCharges) {
            b.extraCharges.forEach(ex => {
              const amt = Number(ex.debit || 0);
              if (ex.category === 'Restaurant') totalRestaurantRev += amt;
              else if (ex.category === 'Spa') totalSpaRev += amt;
              else if (ex.category === 'Tour') totalTourRev += amt;
            });
          }
        }
      });

      const totalRevenueSum = totalAccomRev + totalRestaurantRev + totalSpaRev + totalTourRev;
      const estimatedVat = totalRevenueSum * 0.10; // 10% VAT standard calculation

      return e('div', null,
        e(FinanceReceivablePayableComponent, { adminSettings }),
        e('h2', null, '💰 Financial Management & Revenue Center'),
        e('p', { className: 'text-muted', style: { marginBottom: '1.5rem' } }, 'Comprehensive financial ledger tracking accommodation revenue, departmental incidentals, and tax obligations.'),

            e('p', { style: { fontSize: '0.8rem', color: '#94a3b8', marginTop: '0.5rem' } }, 'Combined room rates and departmental incidentals')

          e('div', { className: 'card-lg', style: { backgroundColor: '#ffffff' } },
            e('h3', { style: { fontSize: '0.875rem', color: '#64748b', marginBottom: '0.25rem', textTransform: 'uppercase' } }, 'Estimated VAT Payable (10%)'),
            e('p', { style: { fontSize: '2rem', fontWeight: 800, color: '#f59e0b' } }, '$' + estimatedVat.toFixed(2)),

    function moneyDesk(n) { return '$' + Number(n || 0).toFixed(2); }

    function DeskFolioComponent({ roomList, roomBookings, setRoomBookings, adminSettings }) {
      const storageKey = 'Lynnaya Oudom resort_desk_folio_v1';
      const [items, setItems] = useState(() => {
        try { return JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch (err) { return []; }
      });
      const [type, setType] = useState('Deposit');
      const [method, setMethod] = useState('Cash');
      const [ref, setRef] = useState('DESK-' + Math.floor(100000 + Math.random() * 900000));
      const [desc, setDesc] = useState('Guest deposit / advance payment');
      const [amt, setAmt] = useState('');
      const [selectedId, setSelectedId] = useState('');
      const [targetRoom, setTargetRoom] = useState(roomList[0] || '');
      const [targetBooking, setTargetBooking] = useState('');
      const [targetFolio, setTargetFolio] = useState('Master');

      useEffect(() => { localStorage.setItem(storageKey, JSON.stringify(items)); }, [items]);
      useEffect(() => { if (!roomList.includes(targetRoom) && roomList.length) setTargetRoom(roomList[0]); }, [roomList, targetRoom]);

      const bookingOptions = roomBookings[targetRoom] || [];
      const postDesk = async (ev) => {
        ev.preventDefault();
        const n = Number(amt);
        if (!n || n <= 0 || !ref.trim() || !desc.trim()) { alert('Enter a valid reference, description and amount.'); return; }
        const now = new Date();
        const x = {
          id: 'DF-' + Date.now(), invoiceNumber: ref.trim(), description: desc.trim(),
          category: type === 'Deposit' ? 'Deposit (' + method + ')' : 'Desk Posting (' + method + ')',
          debit: type === 'Charge' ? Math.abs(n) : 0,
          credit: type === 'Charge' ? 0 : -Math.abs(n),
          transactionType: type === 'Deposit' ? 'Deposit' : 'Desk Posting', paymentMethod: method,
          date: now.toISOString().split('T')[0], postedAt: now.toISOString(), status: 'Open'
        };
        setItems(prev => [x, ...prev]);
        setAmt(''); setRef('DESK-' + Math.floor(100000 + Math.random() * 900000));
        await sendTelegramMessage(adminSettings.botToken, adminSettings.chatId, `💼 *Desk Folio Posting*\nRef: *${x.invoiceNumber}*\nType: *${x.transactionType}*\nAmount: *$${n.toFixed(2)}*`);
      };

      const transferToRoom = async () => {
        const i = items.findIndex(x => x.id === selectedId && x.status === 'Open');
        const bi = Number(targetBooking);
        if (i < 0) { alert('Select an open Desk Folio transaction.'); return; }
        if (!targetRoom || !Number.isInteger(bi) || !bookingOptions[bi]) { alert('Select a room and booking.'); return; }
        const x = items[i];
        const now = new Date().toISOString();
        const id = 'DFTRF-' + Date.now();
        const incoming = {
          ...x, id: id + '-IN', invoiceNumber: id,
          description: x.description + ' [Desk Folio Transfer]', transactionType: 'Transfer',
          transferId: id, transferDirection: 'IN', fromFolio: 'Desk Folio', toFolio: targetFolio,
          relatedInvoiceNumber: x.invoiceNumber, transferredAt: now
        };
        const out = {
          id: id + '-OUT', invoiceNumber: id, description: `Transfer to Room ${targetRoom} ${targetFolio} [${x.invoiceNumber}]`,
          category: 'Transfer Out', debit: x.credit < 0 ? Math.abs(x.credit) : 0,
          credit: x.debit > 0 ? -Math.abs(x.debit) : 0, transactionType: 'Transfer', transferId: id,
          transferDirection: 'OUT', fromFolio: 'Desk Folio', toFolio: targetFolio,
          relatedInvoiceNumber: x.invoiceNumber, date: new Date().toISOString().split('T')[0], postedAt: now
        };
        const next = [...items];
        next[i] = { ...x, status: 'Transferred', transferredAt: now, transferId: id };
        next.splice(i, 0, out);
        setItems(next);
        const b = { ...bookingOptions[bi] };
        if (targetFolio === 'Master') b.masterFolioItems = [...(b.masterFolioItems || []), incoming];
        else b.extraCharges = [...(b.extraCharges || []), incoming];
        const rb = [...bookingOptions]; rb[bi] = b;
        setRoomBookings({ ...roomBookings, [targetRoom]: rb });
        setSelectedId('');
        alert(`Desk transaction ${x.invoiceNumber} transferred to Room ${targetRoom} ${targetFolio}.`);
      };

      const net = items.reduce((n, x) => n + ledgerAmount(x), 0);
      return e('div', { className: 'card-lg', style: { marginTop: '1.5rem' } },
        e('div', { className: 'flex-between', style: { flexWrap: 'wrap', gap: '.75rem' } },
          e('div', null,
            e('h3', null, '💼 Desk Folio / Cashier Posting Desk'),
            e('p', { className: 'text-muted' }, 'Central desk ledger for deposits and miscellaneous postings. Stored separately and transferable to any room folio.')
          ),
          e('strong', null, 'Net: ' + moneyDesk(net))
        ),
        e('form', { onSubmit: postDesk, style: { marginTop: '1rem' } },
          e('div', { className: 'form-grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' } },
            e('div', { className: 'form-group' }, e('label', { className: 'form-label' }, 'Posting Type'), e('select', { className: 'form-select', value: type, onChange: ev => setType(ev.target.value) }, e('option', { value: 'Deposit' }, 'Deposit / Advance (-)'), e('option', { value: 'Charge' }, 'Desk Charge (+)'))),
            e('div', { className: 'form-group' }, e('label', { className: 'form-label' }, 'Payment Method'), e('select', { className: 'form-select', value: method, onChange: ev => setMethod(ev.target.value) }, ['Cash','Visa / Mastercard','Bank Transfer','Bakong QR'].map(x => e('option', { key: x }, x)))),
            e('div', { className: 'form-group' }, e('label', { className: 'form-label' }, 'Reference / Receipt'), e('input', { className: 'form-input', value: ref, onChange: ev => setRef(ev.target.value), required: true })),
            e('div', { className: 'form-group' }, e('label', { className: 'form-label' }, 'Amount ($)'), e('input', { className: 'form-input', type: 'number', min: '0.01', step: '0.01', value: amt, onChange: ev => setAmt(ev.target.value), required: true })),
            e('div', { className: 'form-group full' }, e('label', { className: 'form-label' }, 'Description'), e('input', { className: 'form-input', value: desc, onChange: ev => setDesc(ev.target.value), required: true }))
          ),
          e('button', { className: 'btn-primary', type: 'submit' }, 'Post to Desk Folio')
        ),
        e('div', { className: 'card-lg', style: { marginTop: '1rem', background: '#f8fafc' } },
          e('h4', null, '🔄 Transfer Desk Transaction to Room Folio'),
          e('div', { className: 'form-grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', marginTop: '.75rem' } },
            e('div', { className: 'form-group' }, e('label', { className: 'form-label' }, 'Desk Transaction'), e('select', { className: 'form-select', value: selectedId, onChange: ev => setSelectedId(ev.target.value) }, e('option', { value: '' }, 'Select transaction'), items.filter(x => x.status === 'Open').map(x => e('option', { key: x.id, value: x.id }, `${x.invoiceNumber} — ${x.description} — ${moneyDesk(Math.abs(ledgerAmount(x)))}`)))),
            e('div', { className: 'form-group' }, e('label', { className: 'form-label' }, 'Room'), e('select', { className: 'form-select', value: targetRoom, onChange: ev => { setTargetRoom(ev.target.value); setTargetBooking(''); } }, roomList.map(r => e('option', { key: r, value: r }, r)))),
            e('div', { className: 'form-group' }, e('label', { className: 'form-label' }, 'Booking / Guest'), e('select', { className: 'form-select', value: targetBooking, onChange: ev => setTargetBooking(ev.target.value) }, e('option', { value: '' }, 'Select booking'), bookingOptions.map((b,i) => e('option', { key: i, value: String(i) }, `${b.surname || ''} ${b.lastName || ''} — ${b.checkIn} → ${b.checkOut} (${b.status})`)))),
            e('div', { className: 'form-group' }, e('label', { className: 'form-label' }, 'Target Folio'), e('select', { className: 'form-select', value: targetFolio, onChange: ev => setTargetFolio(ev.target.value) }, e('option', { value: 'Master' }, 'Master Folio'), e('option', { value: 'Extra' }, 'Extra / Department')))
          ),
          e('button', { className: 'btn-secondary', type: 'button', onClick: transferToRoom }, 'Transfer to Room Folio')
        ),
        e('div', { className: 'table-container', style: { marginTop: '1rem', maxHeight: '320px' } },
          e('table', null,
            e('thead', null, e('tr', null, ['Date','Reference','Type','Method','Description','Debit (+)','Credit (-)','Status'].map(h => e('th', { key: h }, h)))),
            e('tbody', null, items.map(x => e('tr', { key: x.id, className: x.status === 'Transferred' ? 'transaction-voided' : '' },

              e('td', null, x.status)
            )))
          )
        )
      );
    }

    function saveOfficialAuditPack({date, property, roomList, roomBookings, source='PMS', user='System'}) {
      try {
        const posSales = JSON.parse(localStorage.getItem('Lynnaya Oudom resort_pos_sales_v1') || '[]');
        const desk = JSON.parse(localStorage.getItem('Lynnaya Oudom resort_desk_folio_v1') || '[]');
        const ar = JSON.parse(localStorage.getItem('Lynnaya Oudom resort_accounts_receivable_v1') || '[]');
        const ap = JSON.parse(localStorage.getItem('Lynnaya Oudom resort_accounts_payable_v1') || '[]');
        const existing = JSON.parse(localStorage.getItem('Lynnaya Oudom resort_audit_packs_v1') || '[]');
        const snapshot = {
          id:'AUDIT-PACK-'+date+'-'+Date.now(), date, propertyId:property.id, propertyName:property.name,
          address:property.address||'', phone:property.phone||'', email:property.email||'', website:property.website||'',
          source, savedAt:new Date().toISOString(), savedBy:user,
          roomList:[...roomList], roomBookings:JSON.parse(JSON.stringify(roomBookings)),
          posSales:posSales.filter(x=>!x.propertyId||x.propertyId===property.id).filter(x=>x.businessDate===date),
          deskFolio:desk.filter(x=>!x.date||x.date===date),
          ar:ar.filter(x=>!x.date||x.date===date), ap:ap.filter(x=>!x.date||x.date===date)
        };
        const withoutSame=existing.filter(x=>!(x.date===date&&x.propertyId===property.id));
        localStorage.setItem('Lynnaya Oudom resort_audit_packs_v1',JSON.stringify([snapshot,...withoutSame]));
        return snapshot;
      } catch(err) { console.warn('Audit pack archive failed',err); return null; }
    }

        if (updatedConfigs[oldRoomName]) {
          updatedConfigs[trimmed] = updatedConfigs[oldRoomName];

      const ensurePdfJs = async () => {
        if (window.pdfjsLib) return window.pdfjsLib;
        await new Promise((resolve, reject) => {
          const existing = document.querySelector('script[data-pdfjs-loader="1"]');
          if (existing) {
            existing.addEventListener('load', resolve, { once: true });
            existing.addEventListener('error', reject, { once: true });
            return;
          }
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
          script.crossOrigin = 'anonymous';
          script.dataset.pdfjsLoader = '1';
          script.onload = resolve;
          script.onerror = () => reject(new Error('PDF reader could not be loaded. Open the app online once, then try again.'));
          document.head.appendChild(script);
        });
        if (!window.pdfjsLib) throw new Error('PDF reader is unavailable.');
        try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; } catch(e) {}
        return window.pdfjsLib;
      };

      const pdfDateToIso = (value) => {
        const m = String(value || '').match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
        if (!m) return '';
        const dd = String(m[1]).padStart(2,'0');
        const mm = String(m[2]).padStart(2,'0');
        return `${m[3]}-${mm}-${dd}`;
      };

      const cleanPdfText = (value) => String(value || '').replace(/[\u0000\u00a0]/g,' ').replace(/[ \t]+/g,' ').trim();

      const extractPdfLines = async (file) => {
        const pdfjs = await ensurePdfJs();
        const buffer = await file.arrayBuffer();
        const pdf = await pdfjs.getDocument({ data: buffer }).promise;
        const allLines = [];
        for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
          const page = await pdf.getPage(pageNo);
          const content = await page.getTextContent({ normalizeWhitespace: true });
          const groups = {};
          (content.items || []).forEach(item => {
            const txt = cleanPdfText(item.str);
            if (!txt) return;
            const x = Number(item.transform && item.transform[4] || 0);
            const y = Number(item.transform && item.transform[5] || 0);
            const key = String(Math.round(y / 2) * 2);
            if (!groups[key]) groups[key] = [];
            groups[key].push({ x, txt });
          });
          Object.keys(groups).sort((a,b)=>Number(b)-Number(a)).forEach(key => {
            const parts = groups[key].sort((a,b)=>a.x-b.x).map(x=>x.txt);
            const line = cleanPdfText(parts.join(' '));
            if (line) allLines.push({ page: pageNo, text: line });
          });
        }
        return allLines;
      };

      const findImportedRoom = (tokens, knownRooms) => {
        for (let i = 0; i < tokens.length; i++) {
          const token = String(tokens[i] || '').replace(/[^A-Za-z0-9_-]/g,'');
          if (knownRooms.includes(token)) return { index:i, room:token };
        }
        for (let i = 0; i < tokens.length; i++) {
          const token = String(tokens[i] || '').replace(/[^A-Za-z0-9_-]/g,'');
          if (/^\d{3}$/.test(token) || /^PS[A-Z0-9_-]+$/i.test(token)) return { index:i, room:token };
        }
        return null;
      };

      const parseGuestReportLine = (line, section, knownRooms) => {
        const normalized = cleanPdfText(line).replace(/[|]/g,' ');
        const dateMatch = normalized.match(/^(\d{1,2}[\/-]\d{1,2}[\/-]\d{4})\s+(\d{1,2}[\/-]\d{1,2}[\/-]\d{4})\s+(\d+)\s+(\d+)\s+(.+)$/);
        if (!dateMatch) return null;
        const checkIn = pdfDateToIso(dateMatch[1]);
        const checkOut = pdfDateToIso(dateMatch[2]);
        if (!checkIn || !checkOut || checkIn >= checkOut) return null;
        const nights = Number(dateMatch[3] || 0);
        const confNo = String(dateMatch[4] || '').trim();
        const rest = dateMatch[5].trim();
        const tokens = rest.split(/\s+/).filter(Boolean);
        const foundRoom = findImportedRoom(tokens, knownRooms);
        if (!foundRoom || foundRoom.index === 0) return null;
        let guest = tokens.slice(0, foundRoom.index).join(' ').replace(/[,]+$/,'').trim();
        if (!guest || guest.length < 2) return null;
        // If a PDF text extractor splits the room into a leading status column, remove that marker.
        if (/^(S|R|ROOM)$/i.test(guest)) guest = tokens.slice(1, foundRoom.index).join(' ').trim();
        const afterRoom = tokens.slice(foundRoom.index + 1);
        const adults = Number(afterRoom[0] || 1) || 1;
        const rateToken = afterRoom[2] || afterRoom[1] || '';
        const rate = Number(String(rateToken).replace(/[^0-9.]/g,'')) || 0;
        const status = section === 'Stayovers' ? 'In-House' : (section === 'Departures' ? 'Check-Out' : 'Reserved');
        const nameParts = guest.split(/,\s*/);
        const surname = nameParts[0] || guest;
        const lastName = nameParts.slice(1).join(', ').trim();
        return { checkIn, checkOut, nights, confNo, guest, surname, lastName, room:foundRoom.room, pax:Math.max(1, adults), roomRate:rate, status, section };
      };

      const importGuestsFromPdf = async (event) => {
        const file = event && event.target && event.target.files && event.target.files[0];
        if (event && event.target) event.target.value = '';
        if (!file) return;
        if (!/\.pdf$/i.test(file.name || '') && file.type !== 'application/pdf') {
          alert('Please select a PDF guest report.');
          return;
        }
        setPdfImportBusy(true);
        setPdfImportSummary(null);
        setPdfImportStatus('Reading PDF guest report…');
        try {
          const lines = await extractPdfLines(file);
          let section = '';
          const parsed = [];
          for (const item of lines) {
            const text = cleanPdfText(item.text);
            if (/^Arrivals\b/i.test(text)) { section = 'Arrivals'; continue; }
            if (/^Departures\b/i.test(text)) { section = 'Departures'; continue; }
            if (/^Stayovers\b/i.test(text)) { section = 'Stayovers'; continue; }
            if (!section || /^Checkin\b/i.test(text) || /^Total Rooms/i.test(text) || /^Printed:/i.test(text) || /^Audit Date:/i.test(text)) continue;
            const row = parseGuestReportLine(text, section, roomList);
            if (row) parsed.push(row);
          }
          if (!parsed.length) {
            throw new Error('No guest rows were found. The PDF may be image-only/scanned, or its column text is different from the sample report.');
          }

          const unique = [];
          const seen = new Set();
          parsed.forEach(row => {
            const key = [row.room,row.checkIn,row.checkOut,row.confNo,row.guest].join('|').toLowerCase();
            if (!seen.has(key)) { seen.add(key); unique.push(row); }
          });

          const nextRoomList = [...roomList];
          const nextConfigs = { ...roomConfigs };
          unique.forEach(row => {
            if (!nextRoomList.includes(row.room)) {
              nextRoomList.push(row.room);
              nextConfigs[row.room] = {
                rate: row.roomRate || 150,
                category: row.room === 'PSUR' ? 'Suite' : 'Standard Deluxe',
                operationalStatus: 'Clean',
                breakdown: defaultAccommodationBreakdown()
              };
            } else if (row.roomRate > 0 && nextConfigs[row.room] && !Number(nextConfigs[row.room].rate)) {
              nextConfigs[row.room] = { ...nextConfigs[row.room], rate: row.roomRate };
            }
          });

          const updated = { ...roomBookings };
          nextRoomList.forEach(room => { if (!Array.isArray(updated[room])) updated[room] = []; });
          let added = 0, updatedCount = 0, skippedOverlap = 0;
          unique.forEach(row => {
            const list = [...(updated[row.room] || [])];
            const same = list.findIndex(b => String(b.referenceNo || '') === String(row.confNo) && b.checkIn === row.checkIn && b.checkOut === row.checkOut);
            const booking = {
              surname: row.surname,
              lastName: row.lastName,
              phone: '', email: '', idPassportNo: '', nationality: '',
              checkIn: row.checkIn, checkOut: row.checkOut,
              lengthOfStay: Math.max(1, row.nights || Math.round((new Date(row.checkOut)-new Date(row.checkIn))/86400000)),
              roomRate: Number(row.roomRate || nextConfigs[row.room]?.rate || 150),
              totalAmount: Number(row.roomRate || nextConfigs[row.room]?.rate || 150) * Math.max(1, row.nights || 1),
              status: row.status,
              pax: row.pax,
              bookingAgent: '', sourceOfBooking: row.section === 'Arrivals' ? 'Imported PDF - Arrivals' : row.section === 'Stayovers' ? 'Imported PDF - Stayovers' : 'Imported PDF - Departures',
              sourceBookingAccountCode: '', referenceNo: row.confNo || ('PDF-' + Date.now() + '-' + added),
              note: 'Imported from guest arrivals/stayovers/departures PDF.', passportScans: [], extraCharges: [], masterFolioItems: [],
              auditLogs: { lastAuditedDate: null, auditedDaysCount: 0 }
            };
            if (same >= 0) { list[same] = { ...list[same], ...booking }; updatedCount++; }
            else {
              const overlap = list.some(b => b.status !== 'Cancelled' && b.status !== 'Check-Out' && row.checkIn < b.checkOut && row.checkOut > b.checkIn);
              if (overlap) { skippedOverlap++; return; }
              list.push(booking); added++;
            }
            updated[row.room] = list;
          });
          setRoomList(nextRoomList);
          setRoomConfigs(nextConfigs);
          setRoomBookings(updated);
          setStartDateOffset(0);
          const summary = { total: unique.length, added, updated: updatedCount, skippedOverlap, rooms: new Set(unique.map(r=>r.room)).size };
          setPdfImportSummary(summary);
          setPdfImportStatus(`Imported ${added + updatedCount} guest records from ${file.name}. Availability has been updated.`);
          alert(`Guest PDF import complete.\n\nRows found: ${summary.total}\nAdded: ${added}\nUpdated: ${updatedCount}\nRooms: ${summary.rooms}${skippedOverlap ? `\nSkipped due to overlapping reservation: ${skippedOverlap}` : ''}`);
        } catch (err) {
          console.error('PDF guest import failed', err);
          setPdfImportStatus('PDF import failed: ' + (err && err.message ? err.message : String(err)));
          alert('Could not import the guest PDF. ' + (err && err.message ? err.message : 'Please use the same text-based report format as the sample.'));
        } finally {
          setPdfImportBusy(false);
        }
      };

      const getBookingForDate = (roomName, dateStr) => {
        const bookings = roomBookings[roomName] || [];
        for (let i = 0; i < bookings.length; i++) {

      const handleProcessPaymentSubmit = async (eEvent) => {
        eEvent.preventDefault();
        if (!paymentAmount || isNaN(Number(paymentAmount)) || Number(paymentAmount) <= 0) {
          alert('Please enter a valid payment amount.');
          return;
        }

        // The payment modal is opened from the selected folio card/preview.
        // Use previewFolioData here; the old code referenced an out-of-scope
        // activeFolio variable, which caused the payment submit to fail.

        const roomName = activeFolio && activeFolio.roomName;

        };

        if (paymentFolioTarget === 'Master') {

      const handleOpenTransferModal = (sourceFolioType) => {

        setTransferTarget(source === 'Master' ? 'Extra' : 'Master');
        const items = source === 'Master' ? (previewFolioData?.masterItems || []) : (previewFolioData?.extraCharges || []);
        const first = items.find(x => !x.voided && Number(x.debit || 0) > 0) || items.find(x => !x.voided && ledgerCredit(x) !== 0);

      const handleTransferTransaction = async (ev) => {
        ev.preventDefault();
        if (!previewFolioData || transferSource === transferTarget) {
          alert('Source and target folios must be different.');
          return;
        }
        const roomName = previewFolioData.roomName;
        const bIdx = previewFolioData.bookingIndex;
        const currentBookings = [...(roomBookings[roomName] || [])];
        const currentBooking = currentBookings[bIdx];
        if (!currentBooking) return;
        const sourceItems = transferSource === 'Master' ? (currentBooking.masterFolioItems || []) : (currentBooking.extraCharges || []);
        const itemIndex = sourceItems.findIndex(x => String(x.invoiceNumber || '') === String(transferInvoice || '') && !x.voided && !x.transferred);
        if (itemIndex < 0) {
          alert('Transaction reference was not found in the selected source folio.');
          return;
        }
        const original = sourceItems[itemIndex];
        const debit = Math.abs(Number(original.debit || 0));
        const credit = ledgerCredit(original);
        if (!(debit > 0 || credit !== 0)) {
          alert('Only transactions with a value can be transferred.');
          return;
        }
        const reason = transferReason.trim() || 'Folio transfer';
        const transferId = 'TRF-' + Date.now();
        const now = new Date().toISOString();
        const sourceBalancing = {
          id: transferId + '-OUT',
          roomNumber: roomName,
          category: 'Transfer Out',
          description: `Transfer ${original.invoiceNumber || ''} from ${transferSource} to ${transferTarget} — ${reason}`,
          invoiceNumber: transferId,
          debit: credit < 0 ? Math.abs(credit) : 0,
          credit: debit > 0 ? -debit : 0,
          date: new Date().toISOString().split('T')[0],
          transactionType: 'Transfer',
          transferId,
          transferDirection: 'OUT',
          relatedInvoiceNumber: original.invoiceNumber || '',
          fromFolio: transferSource,
          toFolio: transferTarget,
          transferReason: reason,
          postedAt: now
        };
        const targetItem = {
          ...original,
          id: transferId + '-IN',
          invoiceNumber: transferId,
          description: `${original.description || original.category || 'Transaction'} [Transferred from ${transferSource}]`,
          debit,
          credit,
          transactionType: 'Transfer',
          transferId,
          transferDirection: 'IN',
          relatedInvoiceNumber: original.invoiceNumber || '',
          fromFolio: transferSource,
          toFolio: transferTarget,
          transferReason: reason,
          transferredAt: now,
          originalInvoiceNumber: original.invoiceNumber || ''
        };
        sourceItems[itemIndex] = { ...original, transferred: true, transferredAt: now, transferId, transferToFolio: transferTarget, transferReason: reason, originalDebit: debit, originalCredit: credit, debit: 0, credit: 0 };
        sourceItems.push(sourceBalancing);
        if (transferSource === 'Master') currentBooking.masterFolioItems = sourceItems;
        else currentBooking.extraCharges = sourceItems;
        if (transferTarget === 'Master') currentBooking.masterFolioItems = [...(currentBooking.masterFolioItems || []), targetItem];
        else currentBooking.extraCharges = [...(currentBooking.extraCharges || []), targetItem];
        currentBookings[bIdx] = currentBooking;
        setRoomBookings({ ...roomBookings, [roomName]: currentBookings });
        refreshPreviewFromBooking(currentBooking, previewFolioData);
        setShowTransferModal(false);
        await sendTelegramMessage(adminSettings.botToken, adminSettings.chatId, `🔄 *Folio Transaction Transfer*\nRoom: *${roomName}*\n${transferSource} → ${transferTarget}\nOriginal Ref: *${original.invoiceNumber || '-'}*\nTransfer Ref: *${transferId}*\nReason: ${reason}`);
        alert(`Transaction ${original.invoiceNumber || ''} transferred from ${transferSource} to ${transferTarget}.`);
      };

      // Void a posted payment without deleting the transaction. The original
      // amount/reference are retained for audit history, while the transaction
      // is excluded from folio balances.
      const handleVoidTransaction = async (folioType, itemIndex, transactionRef, folioDataOverride) => {
        const activeFolio = folioDataOverride || previewFolioData;
        if (!activeFolio) return;

        const roomName = activeFolio.roomName;
        const bIdx = activeFolio.bookingIndex;
        const currentBookings = [...(roomBookings[roomName] || [])];
        const currentBooking = currentBookings[bIdx];
        if (!currentBooking) return;

        const sourceItems = folioType === 'Master'
          ? [...(currentBooking.masterFolioItems || [])]
          : [...(currentBooking.extraCharges || [])];
        const item = transactionRef
          ? sourceItems.find(x => String(x.invoiceNumber || '') === String(transactionRef))
          : sourceItems[itemIndex];

        const voidable = item && !item.voided && (String(item.category || '').startsWith('Payment (') || item.transactionType === 'Payment' || isAccommodationPosting(item));
        if (!voidable) { alert('This transaction cannot be voided. Posted payment and audited accommodation transactions can be voided.'); return; }
        const realIndex = sourceItems.indexOf(item);

        const reason = prompt(`Void transaction ${item.invoiceNumber || ''}. Enter void reason:`, isAccommodationPosting(item) ? 'Incorrect room rate posting / audit correction' : 'Incorrect payment / correction');
        if (reason === null) return;
        if (!reason.trim()) {
          alert('A void reason is required.');
          return;
        }

        const originalDebit = Number(item.debit || 0);
        const originalCredit = ledgerCredit(item);
        sourceItems[realIndex] = { ...item, voided: true, voidedAt: new Date().toISOString(), voidReason: reason.trim(), originalDebit, originalCredit, debit: 0, credit: 0 };

        if (folioType === 'Master') currentBooking.masterFolioItems = sourceItems;
        else currentBooking.extraCharges = sourceItems;

        currentBookings[bIdx] = currentBooking;
        const updatedRoomBookings = { ...roomBookings, [roomName]: currentBookings };
        setRoomBookings(updatedRoomBookings);

        const masterItems = currentBooking.masterFolioItems || [];
        const extraCharges = currentBooking.extraCharges || [];
        const masterDebit = masterItems.reduce((sum, x) => sum + Number(x.debit || 0), 0);
        const masterCredit = masterItems.reduce((sum, x) => sum + ledgerCredit(x), 0);
        const extraDebit = extraCharges.reduce((sum, x) => sum + Number(x.debit || 0), 0);
        const extraCredit = extraCharges.reduce((sum, x) => sum + ledgerCredit(x), 0);
        const masterDue = masterDebit + masterCredit;
        const extraDue = extraDebit + extraCredit;

        setPreviewFolioData({
          ...activeFolio,
          masterItems, masterDebit, masterCredit, masterDue,
          extraCharges, extraDebit, extraCredit, extraDue,
          grandTotal: masterDue + extraDue
        });

        await sendTelegramMessage(
          adminSettings.botToken,
          adminSettings.chatId,
          `⚠️ *Transaction Voided*\nRoom: *${roomName}*\nFolio: *${folioType}*\nReference: *${item.invoiceNumber || '-'}*\nAmount: *$${Math.abs(originalDebit + originalCredit).toFixed(2)}*\nReason: ${reason.trim()}`
        );

        alert(`Transaction ${item.invoiceNumber || ''} was voided successfully. The original transaction remains in the folio for audit history.`);
      };

      const handleFormChange = (field, value) => {
        const updated = { ...formData, [field]: value };
        
        if (field === 'checkIn' || field === 'checkOut') {
          const start = new Date(field === 'checkIn' ? value : updated.checkIn);
          const end = new Date(field === 'checkOut' ? value : updated.checkOut);
          const diffTime = end - start;
          const diffDays = Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
          updated.lengthOfStay = diffDays;
          updated.totalAmount = diffDays * Number(updated.roomRate || 0);
        } else if (field === 'roomRate' || field === 'lengthOfStay') {
          updated.totalAmount = Number(updated.roomRate || 0) * Number(updated.lengthOfStay || 1);
        } else if (field === 'pax') {
          updated.pax = Math.max(1, Math.min(20, Number(value) || 1));
          updated.passportScans = makePassportSlots(updated.pax, formData.passportScans || []);
        } else if (field === 'room') {
          const conf = roomConfigs[value] || { rate: 150 };
          const initialRate = conf.rate;
          updated.roomRate = initialRate;
          updated.totalAmount = Number(updated.lengthOfStay || 1) * initialRate;

        };

        if (modalMode === 'create') {

            return;
          }
          const roomsToCreate = selectedRooms.length ? selectedRooms : ['__UNASSIGNED__'];
          const updatedBookings = { ...roomBookings };
          const createdReservations = [];
          roomsToCreate.forEach((assignedRoom, idx) => {

          setReservations(prev => [...prev, ...createdReservations.map((b, idx) => ({

            checkIn: b.checkIn, checkOut: b.checkOut, status: b.status, pax: Number(b.pax || 2),
            phone: String(b.phone || '').trim(), email: String(b.email || '').trim(), sourceOfBooking: String(b.sourceOfBooking || 'OTA'),

    function ModeLauncher() {
      const [mode, setMode] = useState(null);
      const [loggedUser,setLoggedUser]=useState(null);
      const [pendingMode,setPendingMode]=useState(null);
      const [selectedShift,setSelectedShift]=useState('Morning Shift');
      const switchMode = (m) => setMode(m);
      const roomListState = useState(() => { try { return JSON.parse(localStorage.getItem('Lynnaya Oudom resort_room_list_v2') || '[]'); } catch(err){ return []; } });
      const [roomList, setRoomList]=roomListState;
      const [roomBookings, setRoomBookings] = useState(() => { try { return JSON.parse(localStorage.getItem('Lynnaya Oudom resort_room_bookings_v16') || '{}'); } catch(err){ return {}; } });
      const [adminSettings, setAdminSettings] = useState(() => { try { return JSON.parse(localStorage.getItem('Lynnaya Oudom resort_admin_settings_v2') || '{}'); } catch(err){ return {}; } });
      useEffect(()=>{ if(mode==='POS'){ const saved=localStorage.getItem('Lynnaya Oudom resort_room_list_v2'); if(saved) try{setRoomList(JSON.parse(saved))}catch(err){} } },[mode]);
      useEffect(()=>{ localStorage.setItem('Lynnaya Oudom resort_room_bookings_v16', JSON.stringify(roomBookings)); },[roomBookings]);
      useEffect(()=>{ localStorage.setItem('Lynnaya Oudom resort_room_list_v2', JSON.stringify(roomList)); },[roomList]);
      useEffect(()=>{ localStorage.setItem('Lynnaya Oudom resort_admin_settings_v2', JSON.stringify(adminSettings)); },[adminSettings]);
      const normalizedSettings = (()=>{ const x={...adminSettings}; if(!Array.isArray(x.propertyProfiles)||!x.propertyProfiles.length)x.propertyProfiles=[DEFAULT_PROPERTY_PROFILE]; if(!x.activePropertyId)x.activePropertyId=x.propertyProfiles[0].id; if(!Array.isArray(x.users)||!x.users.length)x.users=[{id:'user-admin',username:'Oudom',password:'124',role:'Admin',active:true}]; if(!Array.isArray(x.accountCodes))x.accountCodes=[]; if(!x.shiftAssignments||typeof x.shiftAssignments!=='object')x.shiftAssignments={}; ['Morning Shift','Afternoon Shift','Night Shift'].forEach((shift,i)=>{if(!x.shiftAssignments[shift])x.shiftAssignments[shift]={username:i===0?'Oudom':'',password:i===0?'124':'',active:true};}); return x; })();
      const chooseShift=(m)=>{setPendingMode(m);setSelectedShift('Morning Shift');};
      const beginShift=(shift, modeToOpen, allowCurrentUserFallback=false)=>{
        const account=normalizedSettings.shiftAssignments&&normalizedSettings.shiftAssignments[shift];
        const configured=!!(account&&account.username&&account.password&&account.active!==false);
        if(!configured && !allowCurrentUserFallback){
          alert('This shift has no active username/password assigned. Please ask an Admin to configure it in Admin → Work Shift Login Accounts.');
          return false;
        }
        const fallback=(loggedUser&&loggedUser.username)?loggedUser:{username:'Oudom',password:'124',role:'Admin',active:true};
        const loginUser=configured?account:fallback;
        const sessionId='SHIFT-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
        const nextUser={...fallback,...loginUser,shift,shiftUsername:loginUser.username,shiftSessionId:sessionId,shiftOpenedAt:new Date().toISOString()};
        setLoggedUser(nextUser);
        setAdminSettings(prev=>({...prev,lastLoginUser:loginUser.username,lastLoginAt:new Date().toISOString()}));
        if(modeToOpen){
          setPendingMode(null);
          // Force the active HMS/POS component to remount so the new shift starts with fresh shift counters.
          setMode(null);
          setTimeout(()=>setMode(modeToOpen),0);
        }
        return true;
      };
      const confirmShift=()=>beginShift(selectedShift,pendingMode,false);
      const handleShiftClosed=()=>{setMode(null);setPendingMode(null);setSelectedShift('Morning Shift');setLoggedUser(null);};
      const handleShiftHandover=(shift)=>{ const ok=beginShift(shift, mode || 'PMS', true); return ok!==false; };
      if(!loggedUser) return e(LoginScreen,{adminSettings:normalizedSettings,onLogin:u=>{setLoggedUser(u);setAdminSettings({...normalizedSettings,lastLoginUser:u.username,lastLoginAt:new Date().toISOString()});}});

          e('div',{style:{fontSize:'2.5rem'}},'🏨'),
          e('h1',{style:{marginTop:'.5rem',fontSize:'1.8rem'}},getActivePropertyProfile(normalizedSettings).name),
          e('p',{className:'text-muted',style:{marginTop:'.5rem'}},'Welcome, '+loggedUser.username+'. Select the system mode to start.'),
          e('div',{className:'mode-grid'},
            e('button',{className:'mode-btn',onClick:()=>chooseShift('PMS')},e('strong',null,'🏨 HMS / PMS Mode'),e('span',null,'Property Management: reservations, rooms, folios, night audit, finance, reports and administration.')),
            e('button',{className:'mode-btn',onClick:()=>chooseShift('POS')},e('strong',null,'🍽️ POS Mode'),e('span',null,'Point of Sale: restaurant, bar and other outlets. Create groups/items and post guest bills to In-House room folios.'))
          ),
          e('p',{className:'text-muted',style:{marginTop:'1rem',fontSize:'.8rem'}},'Logged in as '+loggedUser.username+' • '+loggedUser.role)
        ),
        pendingMode&&e('div',{className:'modal-overlay'},e('div',{className:'modal-card',style:{maxWidth:'520px'}},
          e('h3',null,'🕐 Choose Work Shift'),
          e('p',{className:'text-muted'},'Select the shift you are working before entering '+(pendingMode==='PMS'?'HMS / PMS':'POS')+' Mode.'),
          e('div',{className:'form-group',style:{marginTop:'1rem'}},e('label',{className:'form-label'},'Work Shift'),e('select',{className:'form-select',value:selectedShift,onChange:ev=>setSelectedShift(ev.target.value)},e('option',null,'Morning Shift'),e('option',null,'Afternoon Shift'),e('option',null,'Night Shift'))),
          e('div',{style:{marginTop:'1rem',padding:'.75rem',background:'#f8fafc',borderRadius:'.5rem'}},e('b',null,'Assigned user: '),normalizedSettings.shiftAssignments[selectedShift]&&normalizedSettings.shiftAssignments[selectedShift].username?normalizedSettings.shiftAssignments[selectedShift].username:'Not configured'),
          e('div',{className:'modal-actions'},e('button',{className:'btn-secondary',onClick:()=>setPendingMode(null)},'Cancel'),e('button',{className:'btn-primary',onClick:confirmShift},'Continue to '+(pendingMode==='PMS'?'HMS / PMS':'POS')))
        ))
      );
      if(mode==='PMS') return e(PMSApp,{onSwitchMode:switchMode,currentUser:loggedUser,onShiftClosed:handleShiftHandover});
      return e(POSApp,{roomList,roomBookings,setRoomBookings,adminSettings:normalizedSettings,onSwitchMode:switchMode,currentUser:loggedUser,onShiftClosed:handleShiftHandover});
    }

    ReactDOM.render(e(AppErrorBoundary,null,e(ModeLauncher)), document.getElementById('root'));
  </script>
   <script>
  (function(){
    function updateLynnayaNetworkStatus(){
      var el=document.getElementById('offline-status');
      if(!el) return;
      var online=navigator.onLine!==false;
      el.textContent=online?'🟢 Online':'🟠 Offline mode';
      el.classList.toggle('offline',!online);
      el.title=online?'Connected. Local hotel data remains stored on this device.':'Offline mode: local PMS/POS functions continue using data stored on this device. Internet-only services may be unavailable.';
    }
    window.addEventListener('online',updateLynnayaNetworkStatus);
    window.addEventListener('offline',updateLynnayaNetworkStatus);
    updateLynnayaNetworkStatus();
  })();
   </script>
   <script>
  (function(){
    window.__lynnayaPWA = window.__lynnayaPWA || {installPrompt:null};
    window.installLynnayaApp = async function(){
      const p = window.__lynnayaPWA.installPrompt;
      if(p){ p.prompt(); try{ await p.userChoice; }catch(e){} window.__lynnayaPWA.installPrompt=null; return; }
      alert('If your browser does not show the install prompt, open the browser menu and choose “Install app” or “Add to Home screen”.');
    };
    window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); window.__lynnayaPWA.installPrompt=e; window.dispatchEvent(new Event('lynnaya-pwa-install-available')); });
    window.addEventListener('appinstalled', function(){ window.__lynnayaPWA.installPrompt=null; window.dispatchEvent(new Event('lynnaya-pwa-installed')); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=30',{updateViaCache:'none'}).catch(function(err){ console.warn('PWA service worker registration failed', err); });
  })();
